<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet">
  <!-- 사다리 타기 독박 배경: 출발한 친구가 사다리를 타고 내려와 '독박' 칸에 도착 -->
  <defs>
    <g id="blob">
      <path d="M-22 14 C-24 -14 24 -14 22 14 C20 26 -20 26 -22 14Z" stroke="#333B4D" stroke-width="4"/>
      <circle cx="-7" cy="4" r="3" fill="#333B4D"/><circle cx="7" cy="4" r="3" fill="#333B4D"/>
      <ellipse cx="-14" cy="12" rx="4" ry="2.5" fill="#FF4F7B" opacity=".5"/><ellipse cx="14" cy="12" rx="4" ry="2.5" fill="#FF4F7B" opacity=".5"/>
    </g>
  </defs>

  <!-- 출발: 친구 넷 -->
  <g transform="translate(80 78)"><use href="#blob" fill="#7ED9B0"/><path d="M-4 12 q4 4 8 0" fill="none" stroke="#333B4D" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(160 78)"><use href="#blob" fill="#FFB800"/><path d="M-5 13 q5 -5 10 0" fill="none" stroke="#333B4D" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(240 78)"><use href="#blob" fill="#4DA3FF"/><path d="M-4 12 q4 4 8 0" fill="none" stroke="#333B4D" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(320 78)"><use href="#blob" fill="#C9A7FF"/><path d="M-4 12 q4 4 8 0" fill="none" stroke="#333B4D" stroke-width="3" stroke-linecap="round"/></g>

  <!-- 사다리 -->
  <g stroke="#333B4D" stroke-width="7" stroke-linecap="round" opacity=".85">
    <path d="M80 110 V470 M160 110 V470 M240 110 V470 M320 110 V470"/>
    <path d="M80 160 H160 M160 220 H240 M240 270 H320 M80 320 H160 M160 380 H240 M240 430 H320"/>
  </g>
  <!-- 내려온 길 (노란 하이라이트) -->
  <path d="M160 110 V160 H80 V320 H160 V380 H240 V430 H320 V470" fill="none" stroke="#FFB800" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path d="M160 110 V160 H80 V320 H160 V380 H240 V430 H320 V470" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 12"/>

  <!-- 결과 칸 -->
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-weight="900" font-size="17" text-anchor="middle">
    <rect x="52" y="484" width="56" height="34" rx="10" fill="#EAF4FF" stroke="#333B4D" stroke-width="4"/><text x="80" y="507" fill="#4DA3FF">통과</text>
    <rect x="132" y="484" width="56" height="34" rx="10" fill="#EAF4FF" stroke="#333B4D" stroke-width="4"/><text x="160" y="507" fill="#4DA3FF">통과</text>
    <rect x="212" y="484" width="56" height="34" rx="10" fill="#EAF4FF" stroke="#333B4D" stroke-width="4"/><text x="240" y="507" fill="#4DA3FF">통과</text>
    <rect x="288" y="480" width="64" height="42" rx="12" fill="#EF4444" stroke="#333B4D" stroke-width="4" transform="rotate(-5 320 501)"/>
    <text x="320" y="509" fill="#fff" font-size="21" transform="rotate(-5 320 501)">독박</text>
  </g>

  <!-- 도착한 친구: 엉엉 -->
  <g transform="translate(318 566)">
    <use href="#blob" fill="#FFB800"/>
    <path d="M-10 4 q3 -4 6 0 M4 4 q3 -4 6 0" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M-7 8 q-3 10 -1 16 M7 8 q3 10 1 16" fill="none" stroke="#4DA3FF" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="17" rx="5" ry="4" fill="#333B4D"/>
  </g>
  <path d="M352 548 q8 -10 0 -18 q-8 8 0 18z" fill="#4DA3FF" stroke="#333B4D" stroke-width="2.5"/>
  <g stroke="#FFB800" stroke-width="4" stroke-linecap="round"><path d="M366 486 l14 -8 M368 504 l16 2 M272 470 l-12 -8"/></g>
</svg>
